name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same branch supersedes an in-progress run.
concurrency:
  group: researchos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads repository contents. Render deployment URLs are kept
# in GitHub Actions secrets and are never written to logs.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Compile backend source
        run: python -m compileall -q backend

      - name: Verify FastAPI application imports
        env:
          # Importing the LangChain client needs a key-shaped value, but this
          # validation step never sends a request to Mistral, Tavily, or Atlas.
          MISTRAL_API_KEY: ci-not-a-real-key
          TAVILY_API_KEY: ci-not-a-real-key
          MONGODB_URI: mongodb://localhost:27017/Researchos
          JWT_SECRET: ci-not-a-real-secret
        run: python -c "from backend.main import app; assert app.title == 'AI Research Report Generator API'"

  deploy:
    name: Deploy to Render
    needs: [frontend, backend]
    # Pull requests are validated only. A deployment is triggered exclusively
    # after both validation jobs pass for a push to the production branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger backend deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "Missing RENDER_BACKEND_DEPLOY_HOOK_URL secret."; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-all-errors --request POST "$DEPLOY_HOOK"

      - name: Trigger frontend deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "Missing RENDER_FRONTEND_DEPLOY_HOOK_URL secret."; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-all-errors --request POST "$DEPLOY_HOOK"
